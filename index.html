<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neptewne</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
</head>
<body>
    <div class="container">

        <div class="menu-hero">
            <h1 class="menu-title">9 Semester MCQs Quiz</h1>
            <p class="menu-sub">Choose a subject and year to start practising.</p>
            <div class="menu-stats" id="menu-stats"></div>
        </div>

        <div id="menu" class="subject-grid"></div>

        <div class="site-footer" id="site-footer"></div>

    </div>

    <script src="quizzes.js"></script>
    <script>
        document.getElementById("site-footer").innerText = footerText();

        // Group the quizzes by subject name
        const groups = {};
        quizList.forEach(q => (groups[q.subject] = groups[q.subject] || []).push(q));

        // Subjects shown as cards, sorted by credit (highest first).
        // A subject with hideCard: true is counted in the totals but gets no card.
        // A subject name used in quizList but missing from "subjects" still shows up
        // (with no credit), so a typo is easy to spot.
        const known = subjects.filter(s => !s.hideCard).sort((a, b) => b.credit - a.credit);
        const unknown = Object.keys(groups)
            .filter(name => !subjects.some(s => s.name === name))
            .map(name => ({ name: name, credit: 0, icon: "📘" }));
        const allSubjects = known.concat(unknown);

        const totalCredits = subjects.reduce((sum, s) => sum + s.credit, 0);
        const maxCredit = Math.max(...known.map(s => s.credit));

        document.getElementById("menu-stats").innerHTML =
            `<span class="stat-chip">${subjects.length} subjects</span>` +
            `<span class="stat-chip">${totalCredits.toFixed(1)} credits</span>` +
            `<span class="stat-chip">${quizList.filter(q => q.status !== "soon").length} past papers</span>`;
        
        // ---- helpers for the year pills ----
        function fmt(sec) {
            const m = Math.floor(sec / 60), s = sec % 60;
            return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }

        function getBest(id) {
            try { return JSON.parse(localStorage.getItem("mbbsquiz:" + id)); }
            catch (e) { return null; }
        }

        function yearChip(q) {
            if (q.status === "soon") {
                return `<span class="year-chip is-soon">${q.year}</span>`;
            }
            const inProgress = q.status === "progress";
            const best = inProgress ? null : getBest(q.id);
            const bestText = best
                ? `<span class="chip-best">${best.score}/${best.of}${best.time != null ? " · " + fmt(best.time) : ""}</span>`
                : "";
            return `<a class="year-chip${inProgress ? " is-progress" : ""}" href="quiz.html?set=${q.id}">${q.year}${bestText}</a>`;
        }

        // Build one card per subject
        let html = "";
        allSubjects.forEach(s => {
            const all = (groups[s.name] || []).sort((a, b) => b.year - a.year);   // newest first
            const ready = all.filter(q => !q.status);
            const progress = all.filter(q => q.status === "progress");
            const soon = all.filter(q => q.status === "soon");
            const count = ready.length + progress.length;
            const creditText = s.credit > 0 ? s.credit.toFixed(1) + " credits" : "";
            const weight = s.credit > 0 ? (s.credit / maxCredit) * 100 : 0;

            // One compact line per group, with the label shown once
            const rows = [
                { list: ready,    label: "",            cls: "" },
                { list: progress, label: "In progress", cls: "row-progress" },
                { list: soon,     label: "Coming soon", cls: "row-soon" }
            ];
            let yearsHtml = "";
            rows.forEach(r => {
                if (!r.list.length) return;
                yearsHtml += `<div class="year-row ${r.cls}">${r.label ? `<span class="row-label">${r.label}</span>` : ""}${r.list.map(yearChip).join("")}</div>`;
            });
            if (!yearsHtml) yearsHtml = `<div class="year-row"><span class="coming-soon">Coming soon</span></div>`;

            html += `
            <div class="subject-card${count === 0 ? " is-empty" : ""}">
                <div class="subject-head">
                <div class="subject-icon">${s.icon}</div>
                <div class="subject-info">
                    <div class="subject-name">${s.name}</div>
                    <div class="subject-count">${count} past paper${count === 1 ? "" : "s"}</div>
                </div>
                ${creditText ? `<div class="credit-badge">${creditText}</div>` : ""}
                </div>
                <div class="weight-bar" title="Weight compared with the highest-credit subject"><i style="width:${weight}%"></i></div>
                ${yearsHtml}
            </div>`;
        });
        document.getElementById("menu").innerHTML = html;
    </script>
    
    <script>
          // Count visits only when the site is online (not when opened from a folder)
          if (location.protocol === "https:") {
            const gc = document.createElement("script");
            gc.async = true;
            gc.src = "https://gc.zgo.at/count.js";
            gc.dataset.goatcounter = "https://mbbsquiz.goatcounter.com/count";
            document.body.appendChild(gc);
          }
        </script>
        
</body>
</html>
